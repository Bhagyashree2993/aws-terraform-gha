# GitHub → GitHub Actions → Format → Init → Validate → Plan → Plan Artifact
#        → Approval → Apply → AWS Infrastructure → Outputs → Validation
name: Terraform AWS Infrastructure

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  id-token: write       # required for AWS OIDC
  contents: read
  pull-requests: write  # to comment the plan on PRs

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.13.4"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_WORKING_DIR: infra
  TF_IN_AUTOMATION: "true"

jobs:
  # ======================================================================
  # Stages 1-5: Format → Init → Validate → Plan → Plan Artifact
  # ======================================================================
  plan:
    name: Format · Init · Validate · Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ---------- 1. Format ----------
      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive -diff

      # ---------- 2. Init ----------
      - name: Terraform Init
        id: init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # ---------- 3. Validate ----------
      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      # ---------- 4. Plan ----------
      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          # exit code: 0 = no changes, 1 = error, 2 = changes present
          if [ $code -eq 1 ]; then exit 1; fi
          if [ $code -eq 2 ]; then echo "has_changes=true" >> "$GITHUB_OUTPUT"; else echo "has_changes=false" >> "$GITHUB_OUTPUT"; fi
          terraform show -no-color tfplan > plan.txt

      - name: Plan summary
        run: |
          {
            echo "## Terraform Plan"
            echo "Changes detected: **${{ steps.plan.outputs.has_changes }}**"
            echo '```hcl'
            head -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8').slice(0, 60000);
            const body = `### Terraform Plan 📋
            Format: \`${{ steps.fmt.outcome }}\` · Init: \`${{ steps.init.outcome }}\` · Validate: \`${{ steps.validate.outcome }}\` · Plan: \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`
            </details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      # ---------- 5. Plan Artifact ----------
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.txt
            ${{ env.TF_WORKING_DIR }}/.terraform.lock.hcl
          retention-days: 5

  # ======================================================================
  # Stages 6-10: Approval → Apply → AWS Infrastructure → Outputs → Validation
  # Runs only on main (push / manual), and only when the plan has changes.
  # ======================================================================
  apply:
    name: Approval · Apply · Outputs · Validation
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest

    # ---------- 6. Approval ----------
    # The "production" environment has Required Reviewers configured in
    # Settings → Environments. The job pauses here until someone approves.
    environment:
      name: production

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=infra/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      # ---------- 7. Apply → 8. AWS Infrastructure ----------
      # Applies exactly the reviewed plan; fails if state changed since planning.
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan

      # ---------- 9. Outputs ----------
      - name: Terraform Outputs
        id: outputs
        run: |
          terraform output -json > outputs.json
          echo "web_url=$(terraform output -raw web_url)"           >> "$GITHUB_OUTPUT"
          echo "instance_id=$(terraform output -raw instance_id)"   >> "$GITHUB_OUTPUT"
          echo "bucket=$(terraform output -raw app_bucket_name)"    >> "$GITHUB_OUTPUT"
          echo "vpc_id=$(terraform output -raw vpc_id)"             >> "$GITHUB_OUTPUT"
          {
            echo "## Terraform Outputs"
            echo '```json'
            cat outputs.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload outputs artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf-outputs-${{ github.sha }}
          path: ${{ env.TF_WORKING_DIR }}/outputs.json

      # ---------- 10. Validation ----------
      - name: Validate VPC exists
        run: |
          state=$(aws ec2 describe-vpcs --vpc-ids "${{ steps.outputs.outputs.vpc_id }}" \
                   --query 'Vpcs[0].State' --output text)
          echo "VPC state: $state"
          [ "$state" = "available" ]

      - name: Validate EC2 instance is running and healthy
        run: |
          aws ec2 wait instance-status-ok --instance-ids "${{ steps.outputs.outputs.instance_id }}"
          aws ec2 describe-instances --instance-ids "${{ steps.outputs.outputs.instance_id }}" \
            --query 'Reservations[0].Instances[0].[InstanceId,State.Name,PublicIpAddress]' --output table

      - name: Validate S3 bucket is reachable
        run: aws s3api head-bucket --bucket "${{ steps.outputs.outputs.bucket }}"

      - name: Validate web server responds (HTTP 200)
        run: |
          url="${{ steps.outputs.outputs.web_url }}/health"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$url" || true)
            echo "Attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ Web server is up at ${{ steps.outputs.outputs.web_url }}"
              echo "### ✅ Validation passed — ${{ steps.outputs.outputs.web_url }}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "❌ Web server did not return 200 within 5 minutes"
          exit 1
